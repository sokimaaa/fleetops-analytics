fleetops {
  storage {
    raw = "data/raw"
    bronze = "data/bronze"
    silver = "data/silver"
    gold = "data/gold"
  }

  dataset {
    taxiType = "yellow"
    year = 2025
    month = 1
  }

  spark {
    appName = "FleetOps Analytics"
    master = "local[*]"
    shufflePartitions = 4
    logLevel = "INFO"
    partitionOverwriteMode = "dynamic"
  }

  anomaly {
    veryLongDurationSeconds = 7200
    veryHighFareAmount = 200.0
    veryHighTipAmount = 50.0
    lowDistanceKmThreshold = 1.0
    lowDistanceHighFareAmount = 80.0
  }
}
